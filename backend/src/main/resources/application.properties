spring.application.name=app
weather.api.url=https://api.open-meteo.com/v1/forecast
geography.api.url=https://nominatim.openstreetmap.org/reverse
# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/weatherapp}
spring.data.mongodb.auto-index-creation=true
# Spring Session
spring.session.store-type=mongodb
spring.session.mongodb.collection-name=spring_session
server.servlet.session.timeout=30m

app.admin.password=${ADMIN_PASSWORD:admin123}
spring.security.user.name=disabled
spring.security.user.password=disabledś